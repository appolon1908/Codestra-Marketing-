name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python -m compileall -q app scripts tests
      - run: pytest -q -m 'not postgres'
      - run: python scripts/validate_api_contract.py
      - run: python -c "from app.main import app, LIVE_ADVERTISING_ENABLED, META_READ_SYNC_ENABLED; assert app; assert LIVE_ADVERTISING_ENABLED is False; assert META_READ_SYNC_ENABLED is False"
      - run: python -c "from app.providers.meta import MetaAdsConnector; assert MetaAdsConnector.live_writes_enabled is False"

  postgres-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codestra_marketing_stage5
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codestra_marketing_stage5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/codestra_marketing_stage5
      POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/codestra_marketing_stage5
      LIVE_ADVERTISING_ENABLED: 'false'
      META_READ_SYNC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python scripts/certify_stage5_postgres.py
      - run: pytest -q -m postgres
